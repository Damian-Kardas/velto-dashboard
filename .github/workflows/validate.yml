name: Validate HACS package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check velto-dashboard.js
      - name: Validate with HACS
        uses: hacs/action@main
        with:
          category: plugin
